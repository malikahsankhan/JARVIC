<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" />
  <title>JARVIC Mini</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: drag;
      width: 100vw;
      height: 100vh;
    }

    .widget {
      width: 100%;
      height: 100%;
      border-radius: 32px;
      background: rgba(6, 8, 20, 0.94);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(6, 182, 212, 0.15);
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 10px 0 4px;
      position: relative;
      transition: border-color 0.4s ease, box-shadow 0.4s ease;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.03);
    }

    .widget::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 32px;
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.05) 0%, transparent 50%, rgba(168, 85, 247, 0.03) 100%);
      pointer-events: none;
      z-index: 1;
    }

    /* ── Glow states ── */
    .widget.speaking { border-color: rgba(16, 185, 129, 0.3); box-shadow: 0 8px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.03), 0 0 60px rgba(16, 185, 129, 0.06); }
    .widget.listening { border-color: rgba(245, 158, 11, 0.3); box-shadow: 0 8px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.03), 0 0 60px rgba(245, 158, 11, 0.06); }
    .widget.thinking { border-color: rgba(168, 85, 247, 0.3); box-shadow: 0 8px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.03), 0 0 60px rgba(168, 85, 247, 0.06); }

    /* ── Orb ── */
    .orb {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      position: relative;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      -webkit-app-region: no-drag;
      z-index: 2;
    }

    .orb-inner {
      width: 100%; height: 100%; border-radius: 50%; position: relative; z-index: 2; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    .orb-inner::before {
      content: ""; position: absolute; inset: 0; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, rgba(6, 182, 212, 0.5), rgba(6, 182, 212, 0.15) 50%, rgba(6, 182, 212, 0.05) 100%);
      transition: background 0.4s ease;
    }
    .orb-inner::after {
      content: ""; position: absolute; inset: -3px; border-radius: 50%;
      background: conic-gradient(from 180deg, transparent 0deg, rgba(6, 182, 212, 0.15) 120deg, rgba(6, 182, 212, 0.5) 240deg, rgba(6, 182, 212, 0.15) 360deg);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 1.5px), #000 calc(100% - 0.5px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 1.5px), #000 calc(100% - 0.5px));
      animation: spin-ring 4s linear infinite; opacity: 0.5; z-index: 1;
    }
    @keyframes spin-ring { to { transform: rotate(360deg); } }

    .mic-icon { width: 18px; height: 18px; fill: rgba(6, 182, 212, 0.8); z-index: 3; position: relative; transition: fill 0.3s ease; }

    .ripple { position: absolute; inset: 0; border-radius: 50%; border: 1px solid rgba(6, 182, 212, 0.08); animation: ripple-out 2.5s ease-out infinite; pointer-events: none; z-index: 0; }
    .ripple:nth-child(2) { animation-delay: 0.8s; }
    .ripple:nth-child(3) { animation-delay: 1.6s; }
    @keyframes ripple-out { 0% { transform: scale(1); opacity: 0.4; } 100% { transform: scale(2.5); opacity: 0; } }

    .orb.listening .orb-inner::before { background: radial-gradient(circle at 35% 30%, rgba(245, 158, 11, 0.55), rgba(245, 158, 11, 0.18) 50%, rgba(245, 158, 11, 0.05) 100%); }
    .orb.listening .orb-inner::after { background: conic-gradient(from 180deg, transparent, rgba(245, 158, 11, 0.3), rgba(245, 158, 11, 0.6), rgba(245, 158, 11, 0.3), transparent); opacity: 0.8; }
    .orb.listening .mic-icon { fill: rgba(245, 158, 11, 0.95); }
    .orb.listening .ripple { border-color: rgba(245, 158, 11, 0.15); }

    .orb.thinking .orb-inner::before { background: radial-gradient(circle at 35% 30%, rgba(168, 85, 247, 0.5), rgba(168, 85, 247, 0.18) 50%, rgba(168, 85, 247, 0.05) 100%); }
    .orb.thinking .orb-inner::after { background: conic-gradient(from 180deg, transparent, rgba(168, 85, 247, 0.3), rgba(168, 85, 247, 0.6), rgba(168, 85, 247, 0.3), transparent); animation: spin-ring 1.2s linear infinite; opacity: 0.9; }
    .orb.thinking .mic-icon { fill: rgba(168, 85, 247, 0.9); }

    .orb.speaking .orb-inner::before { background: radial-gradient(circle at 35% 30%, rgba(16, 185, 129, 0.6), rgba(16, 185, 129, 0.2) 50%, rgba(16, 185, 129, 0.05) 100%); }
    .orb.speaking .orb-inner::after { background: conic-gradient(from 180deg, transparent, rgba(16, 185, 129, 0.4), rgba(16, 185, 129, 0.8), rgba(16, 185, 129, 0.4), transparent); opacity: 1; }
    .orb.speaking .mic-icon { fill: rgba(16, 185, 129, 1); }
    .orb.speaking .ripple { border-color: rgba(16, 185, 129, 0.15); animation: ripple-out 1.5s ease-out infinite; }
    .orb.speaking .ripple:nth-child(2) { animation-delay: 0.5s; }
    .orb.speaking .ripple:nth-child(3) { animation-delay: 1.0s; }

    /* ── Input ── */
    .input-area {
      flex: 1;
      height: 32px;
      display: flex;
      align-items: center;
      z-index: 2;
      min-width: 0;
      -webkit-app-region: no-drag;
    }

    .text-input {
      width: 100%;
      height: 100%;
      background: rgba(6, 182, 212, 0.04);
      border: 1px solid rgba(6, 182, 212, 0.08);
      border-radius: 8px;
      padding: 0 10px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 12px;
      color: #e0e6f0;
      outline: none;
      letter-spacing: 0.01em;
      transition: border-color 0.2s ease;
    }
    .text-input::placeholder { color: rgba(90, 110, 150, 0.4); }
    .text-input:focus { border-color: rgba(6, 182, 212, 0.2); }

    .transcript-display {
      width: 100%; height: 100%; display: flex; align-items: center; padding: 0 10px;
      font-size: 12px; color: rgba(6, 182, 212, 0.6); letter-spacing: 0.01em;
      overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    }
    .transcript-display.has-text { color: #22d3ee; }

    /* ── Buttons ── */
    .btn {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: rgba(90, 110, 150, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      -webkit-app-region: no-drag;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .btn:hover { color: #22d3ee; background: rgba(6, 182, 212, 0.08); }
    .btn svg { width: 14px; height: 14px; }
    .btn-send svg { fill: currentColor; stroke: none; }
    .btn-open svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</head>
<body>
  <div class="widget" id="widget">
    <div class="orb idle" id="orb">
      <div class="ripple"></div>
      <div class="ripple"></div>
      <div class="ripple"></div>
      <div class="orb-inner">
        <svg class="mic-icon" viewBox="0 0 24 24">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
          <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
        </svg>
      </div>
    </div>

    <div class="input-area" id="inputArea">
      <input type="text" class="text-input" id="textInput" placeholder="Type a command..." autocomplete="off" spellcheck="false" />
    </div>

    <button class="btn btn-send" id="sendBtn" title="Send">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>

    <button class="btn btn-open" id="restoreBtn" title="Open JARVIC">
      <svg viewBox="0 0 24 24"><polyline points="15 3 21 3 21 9"/><path d="M21 3l-7 7"/><path d="M21 14v5a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h5"/></svg>
    </button>
  </div>

  <script>
    const widget = document.getElementById('widget');
    const orb = document.getElementById('orb');
    const textInput = document.getElementById('textInput');
    const sendBtn = document.getElementById('sendBtn');
    const restoreBtn = document.getElementById('restoreBtn');
    const bridge = window.miniBridge;
    let isListening = false;

    // ── Mic toggle ──
    orb.addEventListener('click', () => {
      bridge?.sendAction('mic-toggle');
    });

    // ── Text input ──
    textInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && textInput.value.trim()) {
        bridge?.sendAction('send-text', textInput.value.trim());
        textInput.value = '';
      }
    });
    sendBtn.addEventListener('click', () => {
      if (!bridge || !textInput.value.trim()) return;
      bridge.sendAction('send-text', textInput.value.trim());
      textInput.value = '';
    });
    restoreBtn.addEventListener('click', () => { bridge?.restoreMain(); });

    // ── State updates ──
    if (bridge) {
      bridge.onStateUpdate((state, transcript) => {
        widget.className = 'widget';
        if (state === 'speaking') widget.classList.add('speaking');
        else if (state === 'listening') widget.classList.add('listening');
        else if (state === 'thinking') widget.classList.add('thinking');

        orb.className = 'orb';
        if (state === 'listening') { orb.classList.add('listening'); isListening = true; }
        else if (state === 'thinking') { orb.classList.add('thinking'); isListening = false; }
        else if (state === 'speaking') { orb.classList.add('speaking'); isListening = false; }
        else { orb.classList.add('idle'); isListening = false; }

        // Show transcript when listening
        const existingDisplay = document.querySelector('.transcript-display');
        const inputEl = document.getElementById('textInput');
        if (isListening) {
          inputEl.style.display = 'none';
          let display = existingDisplay;
          if (!display) {
            display = document.createElement('div');
            display.className = 'transcript-display';
            document.getElementById('inputArea').appendChild(display);
          }
          display.style.display = 'flex';
          display.textContent = transcript || 'Listening...';
          display.classList.toggle('has-text', !!transcript);
        } else {
          if (existingDisplay) existingDisplay.style.display = 'none';
          inputEl.style.display = 'block';
          inputEl.focus();
        }
      });
    }

    setTimeout(() => textInput.focus(), 200);
    if (!bridge) console.error('[JARVIC Mini] bridge not available.');
  </script>
</body>
</html>
