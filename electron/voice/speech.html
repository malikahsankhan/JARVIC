<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jarvic Browser Speech</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #020617;
        color: #67e8f9;
        font-family: Consolas, monospace;
      }
      body {
        display: grid;
        place-items: center;
      }
      main {
        width: min(680px, calc(100vw - 48px));
        text-align: center;
      }
      h1 {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }
      #status, #transcript {
        margin-top: 16px;
        color: #94a3b8;
        font-size: 12px;
      }
      #transcript {
        min-height: 40px;
        color: #e2e8f0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Jarvic Browser Speech Bridge</h1>
      <div id="status">Connecting</div>
      <div id="transcript"></div>
    </main>
    <script src="./speech.js"></script>
  </body>
</html>
